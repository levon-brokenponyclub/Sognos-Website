name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 08:00 UTC (well within the 7-day pause window)
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via API route
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-ping-secret: ${{ secrets.PING_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/ping")

          echo "Response status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Ping failed with status $STATUS"
            exit 1
          fi

          echo "Supabase keep-alive ping successful"
